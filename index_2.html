<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#e7ebe9; --surface:#ffffff; --surface-2:#f2f5f3; --ink:#14181a; --muted:#5a6461; --line:#d2d9d6;
  --crimson:#9d0208; --crimson-2:#7d0106; --on-crimson:#ffffff;
  --pitch:#2f6b3b; --pitch-2:#2a6135; --chalk:#f6f8f3; --chip-ink:#14181a;
  --sel:#f5c518; --sel-glow:rgba(245,197,24,.45); --warn:#b45309; --warn-bg:#fdf1dc;
  --tag:#e3e8e6; --go:#1a7f37; --go-bg:#e3f3e7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1210; --surface:#151c19; --surface-2:#1c2521; --ink:#e7ede9; --muted:#9aa6a1; --line:#2a3531;
    --crimson:#c8202a; --crimson-2:#a3141c; --on-crimson:#ffffff;
    --pitch:#21502c; --pitch-2:#1d4727; --chalk:#eef2ec; --chip-ink:#14181a;
    --sel:#f5c518; --sel-glow:rgba(245,197,24,.35); --warn:#f0a43a; --warn-bg:#3a2a10;
    --tag:#26312d; --go:#4cc06f; --go-bg:#12301c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1210; --surface:#151c19; --surface-2:#1c2521; --ink:#e7ede9; --muted:#9aa6a1; --line:#2a3531;
  --crimson:#c8202a; --crimson-2:#a3141c; --on-crimson:#ffffff;
  --pitch:#21502c; --pitch-2:#1d4727; --chalk:#eef2ec; --chip-ink:#14181a;
  --sel:#f5c518; --sel-glow:rgba(245,197,24,.35); --warn:#f0a43a; --warn-bg:#3a2a10;
  --tag:#26312d; --go:#4cc06f; --go-bg:#12301c;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

.app{height:100%;display:flex;flex-direction:column}

/* Header */
.top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px 18px;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand img{height:46px;width:auto;border-radius:8px;display:block;background:#fff}
.brand .t1{font:700 21px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.brand .t2{font-size:13px;color:var(--muted);margin-top:3px}
.games{display:flex;gap:6px;justify-self:center}
.gbtn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 14px;min-width:100px;text-align:left;min-height:50px}
.gbtn b{display:block;font:700 19px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.gbtn small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson)}
.gbtn[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.clockbox{display:flex;align-items:center;gap:14px}
.clockface{display:flex;flex-direction:column;align-items:flex-end}
.sync{font:600 12px/1 "Barlow",sans-serif;padding:3px 8px;border-radius:20px;margin-bottom:4px;background:var(--surface-2);color:var(--muted)}
.sync.run{background:#e3f3e7;color:#14532d}.sync.view{background:#e4ecfb;color:#1e3a8a}.sync.lost{background:#fdf1dc;color:#7a3d00}
.period{font:600 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.time{font:700 clamp(48px,6.4vw,78px)/.92 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.next{display:flex;flex-direction:column;align-items:flex-start;padding:6px 12px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);min-width:118px}
.next span{font-size:12.5px;color:var(--muted)}
.next b{font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.next.soon{border-color:var(--crimson)}
.next.due{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson);animation:pulse 1.2s ease-in-out infinite}
.next.due span{color:rgba(255,255,255,.85)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(157,2,8,.25)}}
@media (prefers-reduced-motion: reduce){.next.due{animation:none}}
.ctrl{display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 16px;min-height:52px;
  font:700 19px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson);min-width:150px;font-size:23px}
.btn.primary.pause{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.small{min-height:40px;padding:6px 12px;font-size:17px}
.adjrow{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.btn.danger-s{color:var(--crimson);border-color:var(--crimson);background:transparent}.btn.danger-s.armed{background:var(--crimson);color:#fff}
.codebox{display:flex;gap:8px;margin-top:8px}.codebox input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 18px "Barlow",sans-serif;padding:0 12px}
.adjrow span{color:var(--muted);font-size:14px;margin-right:4px}

/* Banner */
.banner{margin:12px 16px 0;background:var(--crimson);color:var(--on-crimson);border-radius:14px;padding:12px 16px;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.banner h2{margin:0;font:700 24px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.banner p{margin:2px 0 0;font-size:14px;opacity:.9}
.banner .chg{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:240px}
.banner .chg span{background:rgba(255,255,255,.15);border-radius:8px;padding:5px 9px;font-size:15px}
.banner .chg span i{font-style:normal;font-weight:700;margin-right:6px;opacity:.85}
.banner .chg span.warn{background:#fff3d6;color:#7a3d00}
.banner .acts{display:flex;gap:8px}
.banner .btn{background:#fff;color:var(--crimson-2);border-color:#fff}
.banner .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}

/* Main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,1fr);gap:16px;padding:12px 16px 16px;flex:1;min-height:0}
.fieldcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.pitchbox{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:flex-start}
.pitch{position:relative;container-type:inline-size;width:min(100cqw, 68cqh);aspect-ratio:68/100;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pitch .dir{position:absolute;top:8px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font:600 13px "Barlow Condensed",sans-serif}
.chip{position:absolute;transform:translate(-50%,-50%);width:clamp(88px,29%,160px);background:#1f4e9c;color:#fff;
  border-radius:11px;padding:6px 8px 7px;text-align:center;border:2.5px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.chip .ps{font:700 clamp(12px,3.1cqw,14px)/1 "Barlow Condensed",sans-serif;color:#bcd3ff;letter-spacing:.03em}
.chip .nm{font:700 clamp(15px,5.4cqw,25px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.long .nm{font-size:clamp(14px,4.7cqw,22px)}
.chip .mn{font-size:clamp(11px,3cqw,13.5px);color:#dbe6ff;font-variant-numeric:tabular-nums;display:flex;justify-content:center;gap:7px;white-space:nowrap}
.chip .mn b{color:#fff;font-weight:700}
.chip.gk{background:#f3d35b;color:#14181a}.chip.gk .ps{color:#9d0208}.chip.gk .mn,.chip.gk .mn b{color:#2d3331}
.chip.out{background:#c1121f;color:#fff}.chip.out .ps,.chip.out .mn,.chip.out .mn b{color:#ffe3e3}
.chip .inc{margin-top:4px;background:#fff;color:#0f5132;border-radius:6px;padding:2px 4px;font:700 clamp(12px,3.5cqw,16px)/1.15 "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sel{border-color:#fff;box-shadow:0 0 0 4px var(--sel),0 3px 0 rgba(0,0,0,.28)}
.chip.target{border-style:dashed;border-color:#fff}
.chip.warn{background:#ffe1b8;color:#14181a}.chip.warn .ps{color:#9d0208}.chip.warn .mn,.chip.warn .mn b{color:#2d3331}
.hint{min-height:44px;display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;color:var(--muted);text-align:center;padding:0 4px}
.hint.on{color:var(--ink)}
.hint.msg{color:var(--crimson);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:13px 6px 10px;font:700 19px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--crimson)}
.tab .ct{font:600 13px "Barlow",sans-serif;color:var(--muted);margin-left:4px}
.tbody{overflow:auto;padding:12px;flex:1;-webkit-overflow-scrolling:touch}
.ctx{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.ctx.live{background:#fff4c7;color:#3d3000}
:root[data-theme="dark"] .ctx.live{background:#3b3310;color:#fbe9a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ctx.live{background:#3b3310;color:#fbe9a8}}
h3{font:700 19px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:16px 0 8px}
h3:first-child{margin-top:2px}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bp{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-height:92px}
.bp .n{font:700 22px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;display:flex;gap:6px;align-items:center}
.bp .r{font-size:12.5px;color:var(--muted)}
.bp .s{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.bp .s b{font:700 18px "Barlow Condensed",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.bp .up{font-size:14px;line-height:1.2;color:var(--crimson);font-weight:600}
.bp.sel{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-glow)}
.bp.go{border-style:dashed;border-color:var(--crimson)}
.bp.goin{border-color:var(--go);border-width:2.5px;background:var(--go-bg)}
.bp .go2{font:700 17px/1.15 "Barlow Condensed",sans-serif;color:var(--go)}
.bp .tot{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.bp .tot b{color:var(--ink);font-variant-numeric:tabular-nums}
.inj{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600;font-size:14.5px}
button.cell{width:100%;border:1.5px solid transparent;text-align:left;font:inherit;color:inherit;font-size:14px}
button.cell.edit{border-style:dashed;border-color:var(--line)}
button.cell.picked{border:2px solid var(--crimson)}
.picker b{font:inherit;font-weight:700}
.chip .inc.bad{background:#ffe1b8;color:#7a3d00}
.picker{margin-top:8px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:8px}
.pgrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;text-align:left;min-height:52px}
.pgrid button b{display:block;font:700 17px/1.1 "Barlow Condensed",sans-serif}
.pgrid button small{color:var(--muted);font-size:12px}
.pgrid button.cur{border-color:var(--crimson)}
.tag{font:600 11.5px/1.5 "Barlow",sans-serif;background:var(--tag);color:var(--muted);padding:0 6px;border-radius:6px}
.outlist{display:flex;flex-wrap:wrap;gap:6px}
.outlist span{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}

.blk{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.blk.now{border-color:var(--crimson)}
.blk.done{opacity:.62}
.blk .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.blk .bh b{font:700 20px "Barlow Condensed","Arial Narrow",sans-serif}
.pill{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted)}
.pill.now{background:var(--crimson);color:#fff}
.pill.nx{background:#fff4c7;color:#5a4500}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{background:var(--surface-2);border-radius:7px;padding:4px 7px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span{font:700 12px "Barlow Condensed",sans-serif;color:var(--crimson);margin-right:5px}
.cell.warn{background:var(--warn-bg);color:var(--warn)}
.diff{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.diff li{padding:2px 0}
.diff li.warn{color:var(--warn);font-weight:600}
.blk .btn{margin-top:10px;width:100%}

.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .pn b{font:700 19px "Barlow Condensed","Arial Narrow",sans-serif}
.prow .pn .r{font-size:12.5px;color:var(--muted)}
.prow.pteam{grid-template-columns:minmax(0,1fr) auto}
.prow.pteam .pst{display:block}
.scorebar{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.scorebar .side{display:flex;align-items:center;gap:10px;min-width:0}
.scorebar .side.us{justify-content:flex-end}
.scorebar .tm{font:700 19px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebar .side.us .tm{color:var(--crimson)}
.scorebar .num{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.scorebar .dash{font:700 30px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.scorebar .gbtn2{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;min-height:44px;padding:0 12px;font:700 17px "Barlow Condensed",sans-serif;white-space:nowrap}
.scorebar .side.us .gbtn2{background:var(--crimson);border-color:var(--crimson);color:#fff}
#score2 .scorebar{margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 10px}
#score2 .num{font-size:38px}
@media (min-width:900px){#score{display:none}}
@media (max-width:899px){#score2{display:none}}
.songrow{grid-column:1/-1;display:flex;justify-content:center}
.snd{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:4px 12px;font:600 13px "Barlow",sans-serif;color:var(--muted);min-height:32px}
.snd.on{color:var(--ink)}
.scorers{grid-column:1/-1;font-size:13.5px;color:var(--muted);text-align:center}
.goalpick{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
.goalpick .q{font-weight:600;margin-bottom:6px}
.goalpick .opts{display:flex;flex-wrap:wrap;gap:6px}
.goalpick .opts button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;min-height:44px;padding:0 12px;font:700 17px "Barlow Condensed",sans-serif}
.goalpick .opts button.skip{color:var(--muted)}
.log li.goal .lt,.log li.goal .ll div{color:var(--crimson)}
.log .del{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:13px;padding:3px 8px;margin-left:8px}
.log .del.armed{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.gtag{font:600 12px "Barlow",sans-serif;color:var(--crimson);margin-left:4px}
@media (max-width:520px){.scorebar .num{font-size:36px}.scorebar .tm{font-size:16px}.scorebar .gbtn2{padding:0 8px;font-size:15px}}
.prow .pst{font-size:14px}
.prow .pmin{text-align:right}
.prow .pmin b{font:700 19px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;display:block;line-height:1}
.prow .pmin small{font-size:12px;color:var(--muted)}
.prow.out .pn b,.prow.out .pst{color:var(--muted)}
.tog{min-width:76px;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font:700 16px "Barlow Condensed",sans-serif;color:var(--muted)}
.tog.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font:700 22px/1 "Barlow",sans-serif}
.step b{min-width:64px;text-align:center;font:700 19px "Barlow Condensed",sans-serif}
.btn.danger{margin-top:14px;width:100%;color:var(--crimson);border-color:var(--crimson);background:transparent}
.btn.danger.armed{background:var(--crimson);color:#fff}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log .lt{font:700 20px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.log .ll div{font-size:15px}
.log .ll i{font-style:normal;font:700 12.5px "Barlow Condensed",sans-serif;color:var(--crimson);margin-right:6px}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}

.gbtn b,.gbtn small{white-space:nowrap}
@media (max-width: 1440px) and (min-width: 900px){
  .brand>div{display:none}
  .top{grid-template-columns:auto 1fr auto}
  .clockbox{justify-self:end}
  .games{grid-column:1/-1;grid-row:2;justify-self:stretch}
  .gbtn{flex:1;min-width:0;padding:5px 12px;min-height:44px;display:flex;align-items:baseline;gap:10px}
  .gbtn b{display:inline}
}
/* Narrow screens: stack, let the page scroll */
@media (max-width: 899px){.games{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.games .gbtn{flex:1 0 auto}.top{min-width:0}}
@media (max-width: 899px){
  .app{height:auto;min-height:100%}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;grid-template-columns:1fr auto;}
  .brand .t2{display:none}
  .games{grid-column:1/-1;grid-row:3;justify-self:stretch}
  .gbtn{flex:1;min-width:0}

function validPlan(plan,form){const ids=formOf(form).map(p=>p.id);return Array.isArray(plan)&&plan.length>0&&plan.every(b=>b&&ids.every(p=>p in b));}
function freshGame(gc,keep){
  const c=CFG();const form=teamKey(c);const avail={};
  c.players.forEach(p=>avail[p.id]=!(gc.out||[]).includes(p.id));
  const g=fixGame({form,avail:keep?keep.avail:avail,half:keep?keep.half:(gc.half||30),sub:keep?keep.sub:(gc.sub||10),
    otLen:keep?keep.otLen:5,otN:keep?keep.otN:2,events:[],goals:[],saves:[],acc:0,running:false,runStart:0,started:false,

/* ---------- Automatic rotation ---------- */
function autoPlan(g){
  const F=formOf(g.form);const n=Math.max(1,Math.min(12,Math.ceil(2*g.half/g.sub)));
  const avail=PLAYERS.filter(p=>av(g,p.id));
  const gkPos=F.find(p=>p.g==='GK');const field=F.filter(p=>p.g!=='GK');
  let keepers=avail.filter(pureGK);if(!keepers.length)keepers=avail.filter(p=>gr(p).includes('GK'));
  const half=Math.ceil(n/2);
  const cnt={},sat={};avail.forEach(p=>{cnt[p.id]=0;sat[p.id]=false;});
  const plan=[];let prev=null;let fieldGK=null;
  for(let i=0;i<n;i++){
    const b={};
    let gkId=keepers.length?keepers[(keepers.length>=2&&i>=half)?1:0].id:null;
    if(!gkId){if(i===0||i===half||!fieldGK||!avail.some(p=>p.id===fieldGK)){const c=avail.filter(p=>!pureGK(p)).sort((a,c)=>(cnt[a.id]-cnt[c.id])||(avail.indexOf(a)-avail.indexOf(c)))[0];fieldGK=c?c.id:null;}gkId=fieldGK;}
    const pool=avail.filter(p=>p.id!==gkId&&!pureGK(p));
    b[gkPos.id]=gkId;
    const pool2=pool.filter(p=>p.id!==gkId);
    const order=pool2.slice().sort((a,c)=>(cnt[a.id]-cnt[c.id])||((sat[c.id]?1:0)-(sat[a.id]?1:0))||(avail.indexOf(a)-avail.indexOf(c)));
    const chosen=order.slice(0,field.length);
    const open=new Set(field.map(f=>f.id));const placed=new Set();
    if(prev)chosen.forEach(p=>{const q=field.find(f=>prev[f.id]===p.id);if(q&&open.has(q.id)){b[q.id]=p.id;open.delete(q.id);placed.add(p.id);}});
    let rest=chosen.filter(p=>!placed.has(p.id));
    const openArr=field.filter(f=>open.has(f.id));
    openArr.sort((x,y)=>rest.filter(p=>gr(p).includes(x.g)).length-rest.filter(p=>gr(p).includes(y.g)).length);
    openArr.forEach(f=>{let c=rest.filter(p=>gr(p).includes(f.g));if(!c.length)c=rest.slice();c.sort((a,d)=>gr(a).length-gr(d).length);const pick=c[0];
      if(pick){b[f.id]=pick.id;rest=rest.filter(p=>p!==pick);}else b[f.id]=null;});
    pool2.forEach(p=>{const on=Object.values(b).includes(p.id);sat[p.id]=!on;if(on)cnt[p.id]++;});
    if(gkId&&cnt[gkId]!==undefined&&!keepers.some(k=>k.id===gkId)){cnt[gkId]++;sat[gkId]=false;}
    plan.push(b);prev=b;
  }
  return plan;
}

/* ---------- Clock ---------- */
let OFF=0;const T=()=>Date.now()+OFF;
const clock=g=>g.acc+(g.running?T()-g.runStart:0);
const HMS=g=>g.half*60000,SMS=g=>g.sub*60000;
function ends(g){const H=HMS(g);const e=[H,2*H];if(g.ot)for(let k=1;k<=g.ot.n;k++)e.push(2*H+k*g.ot.len*60000);return e;}
const totalMs=g=>{const e=ends(g);return e[e.length-1];};
function pausedAt(g){if(g.running)return null;const c=clock(g);const e=ends(g).find(x=>x===c&&g.stops.includes(x));return e===undefined?null:e;}
function otIndex(g,e){return Math.round((e-2*HMS(g))/(g.ot.len*60000));}
function endLabel(g,e){const H=HMS(g);if(e===H)return 'Halftime';if(e===2*H)return g.ot?'End of regulation':'Full time';const k=otIndex(g,e);return k>=g.ot.n?'Full time':'End of OT '+k;}
function periodName(g,c){const H=HMS(g);if(c<H)return '1st half';if(c<2*H||!g.ot)return '2nd half';return 'OT '+Math.min(g.ot.n,Math.floor((c-2*H)/(g.ot.len*60000))+1);}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtClock(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
const mins=ms=>String(Math.round(ms/60000));
const gmin=t=>Math.floor(Math.max(0,t)/60000)+1+'′';

/* ---------- Replay ---------- */
function replay(g){
  const PS=posIds(g);const now=clock(g);const L=Object.assign({},g.start);const st={};
  const ids=new Set(PLAYERS.map(p=>p.id));PS.forEach(p=>{if(L[p])ids.add(L[p]);});g.events.forEach(e=>{if(e.to)ids.add(e.to);if(e.from)ids.add(e.from);});
  ids.forEach(id=>st[id]={played:0,onAt:null,offAt:0,gk:0});
  const onOf=()=>new Set(PS.map(p=>L[p]).filter(Boolean));
  let on=onOf();on.forEach(id=>{st[id].onAt=0;});
  let gkId=L.GK||null,gkSince=0;
  const batches=[];let cur=null;
  const close=()=>{if(cur){cur.after=Object.assign({},L);cur.lines=describe(cur.before,cur.after,PS);}};
  for(const e of g.events){
    if(!cur||cur.b!==e.b){close();cur={b:e.b,t:e.t,before:Object.assign({},L)};batches.push(cur);}
    L[e.pos]=e.to;
    if(e.pos==='GK'&&L.GK!==gkId){if(gkId&&st[gkId])st[gkId].gk+=Math.max(0,e.t-gkSince);gkId=L.GK||null;gkSince=e.t;}
    const nw=onOf();
    on.forEach(id=>{if(!nw.has(id)&&st[id]){st[id].played+=Math.max(0,e.t-st[id].onAt);st[id].onAt=null;st[id].offAt=e.t;}});
    nw.forEach(id=>{if(!on.has(id)&&st[id])st[id].onAt=e.t;});
    on=nw;
  }
  close();
  on.forEach(id=>{if(st[id])st[id].played+=Math.max(0,now-st[id].onAt);});
  if(gkId&&st[gkId]&&g.started)st[gkId].gk+=Math.max(0,now-gkSince);
  return {L,st,batches,on,now,PS};
}
function describe(b,a,PS){
  PS=PS||POS;
  const posOf=(L,id)=>PS.find(p=>L[p]===id);
  const bs=new Set(PS.map(p=>b[p]).filter(Boolean)),as=new Set(PS.map(p=>a[p]).filter(Boolean));
  const ins=[...as].filter(x=>!bs.has(x)),outs=[...bs].filter(x=>!as.has(x));
  const used=new Set();const lines=[];
  ins.forEach(id=>{const p=posOf(a,id);const o=b[p];
    if(o&&outs.includes(o)&&!used.has(o)){used.add(o);lines.push({k:'sub',p,id,o,t:nm(id)+' in for '+nm(o)});}
    else lines.push({k:'in',p,id,t:nm(id)+' in'});});
  outs.filter(o=>!used.has(o)).forEach(o=>lines.push({k:'out',p:posOf(b,o),id:o,t:nm(o)+' off'}));
  [...as].filter(x=>bs.has(x)&&posOf(a,x)!==posOf(b,x)).forEach(id=>lines.push({k:'move',p:posOf(a,id),id,t:nm(id)+' moves '+posOf(b,id)+' to '+posOf(a,id)}));
  return lines;
}
function winK(g,c){
  if(!g.started||g.fullDone)return null;
  if(g.pending!=null)return g.pending;
  const SUB=SMS(g),H=HMS(g);const nb=Math.floor(c/SUB)+1;
  if(nb*SUB<2*H&&nb<PL().length&&nb*SUB-c<=60000)return nb;
  return null;
}
function upcoming(g,d){const k=winK(g,d.now);if(k==null||!PL()[k])return null;return {k,target:PL()[k],lines:describe(d.L,PL()[k])};}
function blockAt(g,c){return Math.min(PL().length-1,Math.floor(c/SMS(g)));}
function blockRange(g,i){return i*g.sub+'–'+(i+1)*g.sub+' min';}
const plannedFor=(g,id)=>g.plan.filter(b=>Object.values(b).includes(id)).length*g.sub;
function scoreOf(g){const gl=g.goals||[];return {us:gl.filter(x=>x.side==='us').length,them:gl.filter(x=>x.side==='them').length};}
function pkScore(g){return g.pk?{us:g.pk.us.filter(k=>k.made).length,them:g.pk.them.filter(Boolean).length}:{us:0,them:0};}

function countdown(gc){if(!gc.dt)return '';const d=new Date(gc.dt);if(isNaN(d))return '';const ms=d-Date.now();if(ms<=0)return 'Kickoff soon';
  const m=Math.floor(ms/60000),dd=Math.floor(m/1440),hh=Math.floor(m%1440/60),mm=m%60;return 'Kickoff in '+(dd?dd+'d '+hh+'h':hh?hh+'h '+mm+'m':mm+'m');}

/* ---------- Sync ---------- */
const SY={on:false,ok:false,first:true,team:null,lastSent:{},rev:{},inflight:{},editT:{}};
function resetSync(){SY.first=true;SY.team=S.team;SY.lastSent={};SY.rev={};SY.inflight={};SY.editT={};}
const myCode=()=>S.auth[S.team]||'';
const canEdit=()=>!SY.on||!!myCode();
const isParent=()=>!canEdit();
function save(){
  saveLocal();
  if(!SY.on||!canEdit()||SY.team!==S.team||SY.first)return;
  const c=CFG();if(!c)return;
  if(JSON.stringify(c)!==SY.lastSent.cfg){SY.editT.cfg=Date.now();push('cfg');}
  c.games.forEach(gc=>{const st=TS().games[gc.id];if(!st)return;if(JSON.stringify(st)!==SY.lastSent[gc.id]){SY.editT[gc.id]=Date.now();push(gc.id);}});
}
async function push(key){
  const team=S.team;const ts=TS();const obj=key==='cfg'?ts.cfg:ts.games[key];if(!obj)return;
  const body=key==='cfg'?{kind:'config',team,config:obj,code:myCode()}:{kind:'game',team,gid:key,game:obj,code:myCode()};
  SY.lastSent[key]=JSON.stringify(obj);SY.inflight[key]=(SY.inflight[key]||0)+1;let rerender=false;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===401){delete S.auth[team];saveLocal();say('Coach code was not accepted. This device is now view only.');rerender=true;}
    else if(r.status===403){SY.lastSent[key]='';say('Creating a team on the live site needs the main coach code.');rerender=true;}
    else if(r.ok){const j=await r.json();if(SY.team===team&&j.rev>(SY.rev[key]||0))SY.rev[key]=j.rev;SY.ok=true;}
    else{SY.ok=false;SY.lastSent[key]='';}
  }catch(e){SY.ok=false;SY.lastSent[key]='';}
  SY.inflight[key]--;SY.editT[key]=Date.now();
  if(rerender)renderAll();else renderSync();
}
function applyServer(j){
  if(!j||j.team!==S.team||SY.team!==S.team)return;
  const ts=TS();let changed=false;const first=SY.first;
  const busy=k=>SY.inflight[k]||Date.now()-(SY.editT[k]||0)<1500;
  if(j.config&&j.config.team){
    if(!busy('cfg')&&(first||(SY.rev.cfg||0)<j.config.rev)){
      SY.rev.cfg=j.config.rev;const nc=fixCfg(j.config.team);
      if(JSON.stringify(nc)!==JSON.stringify(ts.cfg)){ts.cfg=nc;changed=true;}
      SY.lastSent.cfg=JSON.stringify(ts.cfg);
    }
  }else if(first)SY.lastSent.cfg='';
  if(!ts.cfg){SY.first=false;renderAll();return;}
  if(migrateTeam(S.team,ts))changed=true;
  useTeam();
  const games=j.games||{};
  ts.cfg.games.forEach((gc,i)=>{
    const sg=games[gc.id];
    if(!sg&&first&&Array.isArray(j.legacy)&&j.legacy[i]){const lg=fixGame(j.legacy[i]);
      if(JSON.stringify(lg)!==JSON.stringify(ts.games[gc.id])){ts.games[gc.id]=lg;changed=true;}SY.lastSent[gc.id]='';return;}
    if(!sg||!sg.game){if(first)SY.lastSent[gc.id]='';return;}
    if(busy(gc.id))return;
    if(!first&&(SY.rev[gc.id]||0)>=sg.rev)return;
    SY.rev[gc.id]=sg.rev;const ng=fixGame(sg.game);
    if(JSON.stringify(ng)!==JSON.stringify(ts.games[gc.id])){ts.games[gc.id]=ng;changed=true;}
    SY.lastSent[gc.id]=JSON.stringify(ts.games[gc.id]);
  });
  SY.first=false;
  if(changed||first){useTeam();saveLocal();UI.win=undefined;renderAll();}
  if(canEdit())save();
}
async function getState(team){
  const t0=Date.now();const r=await fetch(API+'?team='+encodeURIComponent(team),{cache:'no-store'});if(!r.ok)throw new Error('bad');
  const j=await r.json();if(!j||typeof j.now!=='number')throw new Error('bad');
  const off=j.now-Math.round((t0+Date.now())/2);OFF=SY.on?Math.round(OFF*0.8+off*0.2):off;return j;
}
async function syncInit(){

  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'verify',team:S.team,code})});

async function switchTeam(id){
  if(!id||id===S.team)return;
  if(!S.T[id])S.T[id]={cfg:null,games:{}};
  S.team=id;UI.sel=null;UI.pick=null;UI.goal=null;UI.pk=null;UI.win=undefined;UI.lastUs=undefined;
  if(!S.auth[id]&&S.master)S.auth[id]=S.master;
  try{history.replaceState(null,'',location.pathname+'?team='+encodeURIComponent(id));}catch(e){}
  resetSync();
  if(SY.on){try{const j=await getState(id);applyServer(j);}catch(e){SY.first=false;}}
  else SY.first=false;
  if(!CFG()){say('That team wasn’t found');S.team='cottontown';resetSync();SY.first=false;}
  useTeam();saveLocal();renderAll();if(canEdit())save();
}
function slug(s){return (s||'team').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'team';}
async function publishAll(){
  const code=S.master||myCode();
  if(!SY.on&&!CLUB.on){say('This only works on the live site');renderHint&&renderHint();return;}
  if(!code){say('Unlock with the main coach code first');return;}
  UI.pubBusy=true;try{renderAll();}catch(e){}if(CLUB.on)renderClub();
  const post=b=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({code},b))});
  let added=0,games=0,failed=0;
  for(const id of Object.keys(S.T)){
    const ts=S.T[id];if(!ts.cfg)continue;migrateTeam(id,ts);
    let srv=null;try{const r=await fetch(API+'?team='+encodeURIComponent(id),{cache:'no-store'});if(r.ok)srv=await r.json();}catch(e){}
    if(!srv){failed++;continue;}
    if(!(srv.config&&srv.config.team)){const r=await post({kind:'config',team:id,config:ts.cfg});if(r.ok)added++;else{failed++;continue;}}
    const have=srv.games||{};
    for(const gc of ts.cfg.games){const st=ts.games[gc.id];if(st&&!have[gc.id]){const r=await post({kind:'game',team:id,gid:gc.id,game:st});if(r.ok)games++;}}
  }
  UI.pubBusy=false;
  say(failed?`Loaded ${added} team${added===1?'':'s'}; ${failed} didn’t load. Check the code and try again.`:added?`Loaded ${added} team${added===1?'':'s'} to the live site`:'All teams were already on the live site');
  if(CLUB.on){CLUB.msg=UI.msg;clubFetch();}else{loadTeamList();renderAll();}
}

  const fmtKey=UI.ntFmt||'9v9';
  const taken=new Set(teamsList().map(t=>t.id));let id=slug(name),k=2;while(taken.has(id))id=slug(name)+'-'+(k++);
  const cfg=fixCfg({id,name,short:name,sub:'',logo:null,song:false,format:fmtKey,formation:Object.keys(FORMS[fmtKey])[0],players:[],
    games:[{id:'g1',title:'Game 1',opp:'',dt:'',field:'',place:'',half:fmtKey==='7v7'?25:fmtKey==='9v9'?30:35,sub:10,out:[]}]});
  const code=myCode()||S.master||'';
  S.T[id]={cfg,games:{}};if(code)S.auth[id]=code;UI.newTeam=false;UI.ntName='';
  await switchTeam(id);S.tab='setup';say('Team created. Add players and games below.');saveLocal();renderAll();

let ac=null,lastAlarm=0,wl=null,songEl=null,lastSong=0;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function alarm(){
  if(isParent()||!S.beep||Date.now()-lastAlarm<1500)return;lastAlarm=Date.now();
  try{unlockAudio();const t0=ac.currentTime;
    [0,0.25,0.5].forEach(d=>{const o=ac.createOscillator(),gn=ac.createGain();o.type='square';o.frequency.value=988;
      gn.gain.setValueAtTime(0.0001,t0+d);gn.gain.exponentialRampToValueAtTime(0.25,t0+d+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.18);
      o.connect(gn);gn.connect(ac.destination);o.start(t0+d);o.stop(t0+d+0.2);});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
const hasSong=()=>!!(CFG()&&CFG().song);
function songOn(){return hasSong()&&(S.song!==undefined?!!S.song:canEdit());}
function songAudio(){if(!songEl){songEl=new Audio(GOAL_SONG);songEl.preload='auto';}return songEl;}
function playSong(){if(!songOn()||Date.now()-lastSong<2500)return;lastSong=Date.now();try{const a=songAudio();a.pause();a.currentTime=0;a.muted=false;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}}
function primeSong(){try{const a=songAudio();a.muted=true;const pr=a.play();if(pr&&pr.then)pr.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});}catch(e){}}
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CFG()){if(G().running)wake();renderAll();}});

/* ---------- Game actions ---------- */
function say(m){UI.msg=m;UI.msgT=Date.now()+2800;}
function change(pairs,label){
  const g=G();if(!pairs.length)return;const d=replay(g);
  if(!g.started){pairs.forEach(x=>{g.start[x.pos]=x.to;});say(label||'Starting lineup updated');}
  else{const b=++g.batch;const t=Math.round(clock(g));
    pairs.forEach(x=>g.events.push({b,t,pos:x.pos,from:d.L[x.pos]||null,to:x.to||null}));
    say((label||'Change made')+' at '+fmt(t));}
  save();
}
const STATS={sot:'Shot on target',soff:'Shot off target',kp:'Key pass',pass:'Good pass',bpass:'Bad pass',tackle:'Tackle won',int:'Interception',
  clr:'Clearance',blk:'Block',thr:'Throw-in',cross:'Cross',drib:'Beat defender',lost:'Lost ball',fwon:'Foul won',foul:'Foul',off:'Offside',corner:'Corner kick',
  save:'Save',catch:'Catch',dist:'Good distribution',gkick:'Goal kick'};
const TOPS={GK:['save','catch','dist','gkick','clr','bpass'],DEF:['tackle','int','clr','pass','thr','blk'],MID:['pass','kp','int','sot','tackle','thr'],FWD:['sot','soff','kp','pass','drib','fwon']};
const GK_ONLY=['save','catch','dist','gkick'];
function statOrder(group){const top=TOPS[group]||TOPS.MID;const rest=Object.keys(STATS).filter(k=>!top.includes(k)&&(group==='GK'||!GK_ONLY.includes(k)));return {top,rest};}
function addStat(pos,id,k){
  const g=G();g.stats=g.stats||[];const t=Math.round(clock(g));
  g.stats.push({t,id,k,pos});
  if(k==='save'){g.saves.push({t,gk:id});}
  UI.lastStat={id,k,at:Date.now()};say(STATS[k]+', '+nm(id));save();
}
function undoStat(){
  const g=G();const s=(g.stats||[]).pop();if(!s){say('No stats to undo');return;}
  if(s.k==='save'){for(let i=g.saves.length-1;i>=0;i--){if(g.saves[i].t===s.t&&g.saves[i].gk===s.id){g.saves.splice(i,1);break;}}}
  say('Removed: '+STATS[s.k]+', '+nm(s.id));save();
}
function statCounts(g){const c={};(g.stats||[]).forEach(s=>{c[s.id]=c[s.id]||{};c[s.id][s.k]=(c[s.id][s.k]||0)+1;});return c;}
function teamShots(g){const st=g.stats||[];const goals=g.goals.filter(x=>x.side==='us').length;const sot=st.filter(s=>s.k==='sot').length,soff=st.filter(s=>s.k==='soff').length;
  return {shots:sot+soff+goals,onT:sot+goals,goals,saves:g.saves.length,ga:g.goals.filter(x=>x.side==='them').length,corners:st.filter(s=>s.k==='corner').length};}
function tapPos(p){
  if(UI.fieldMode==='stat'&&canEdit()){const id=replay(G()).L[p];if(id){UI.sheet={pos:p,id,more:false};renderAll();}return;}
  const sel=UI.sel;const d=replay(G());
  if(sel&&sel.type==='pos'){
    if(sel.pos===p)UI.sel=null;
    else{const a=d.L[sel.pos],b=d.L[p];change([{pos:sel.pos,to:b},{pos:p,to:a}],'Swapped '+nm(a)+' and '+nm(b));UI.sel=null;}
  }else if(sel&&sel.type==='player'){change([{pos:p,to:sel.id}],nm(sel.id)+' in for '+nm(d.L[p]));UI.sel=null;}
  else{UI.sel={type:'pos',pos:p};S.tab='bench';}
  renderAll();
}
function tapBench(id){
  const sel=UI.sel;const g=G();const d=replay(g);
  if(sel&&sel.type==='pos'){const old=d.L[sel.pos];change([{pos:sel.pos,to:id}],nm(id)+' in for '+nm(old));
    if(sel.injury&&old){g.avail[old]=false;const later=PL().some((b,i)=>i>blockAt(g,clock(g))&&POS.some(x=>b[x]===old));
      say(nm(id)+' in, '+nm(old)+' marked out'+(later?'. Fix her later spots on the Plan tab':''));save();}
    UI.sel=null;}
  else if(sel&&sel.type==='player'&&sel.id===id)UI.sel=null;
  else UI.sel={type:'player',id};
  renderAll();
}
function applyPlan(k){
  const g=G();const d=replay(g);const target=PL()[k];if(!target)return;
  const pairs=POS.filter(p=>d.L[p]!==target[p]).map(p=>({pos:p,to:target[p]}));
  if(pairs.length)change(pairs,'Planned subs made');else say('Field already matches the plan');
  if(g.pending===k)g.pending=null;UI.sel=null;save();renderAll();
}
function pickSet(id){
  const g=G();const pk=UI.pick;if(!pk)return;const b=g.plan[pk.k];const old=b[pk.p];
  if(old!==id){
    const q=POS.find(x=>b[x]===id);if(q)b[q]=old;b[pk.p]=id;
    if(pk.all&&old){for(let j=pk.k+1;j<g.plan.length;j++){const bj=g.plan[j];const r=POS.find(x=>bj[x]===old);if(r&&!POS.some(x=>bj[x]===id))bj[r]=id;}}
    say(nm(id)+' now planned at '+pk.p+' for '+blockRange(g,pk.k)+(pk.all?' and later':''));
  }
  UI.pick=null;save();renderAll();
}
function play(){
  const g=G();if(g.fullDone)return;unlockAudio();
  if(g.running){g.acc=clock(g);g.running=false;}
  else{g.started=true;g.runStart=T();g.running=true;wake();}
  save();renderAll();
}
function adjust(delta){
  const g=G();const E=ends(g);const tot=E[E.length-1];const c=Math.min(tot,Math.max(0,clock(g)+delta));
  const prev=g.stops.slice();g.acc=c;if(g.running)g.runStart=T();
  g.stops=E.filter(e=>e<c||(e===c&&prev.includes(e)));
  g.halfDone=c>=HMS(g);g.fullDone=c>=tot;if(g.fullDone){g.running=false;g.pending=null;if(!g.stops.includes(tot))g.stops.push(tot);}
  g.alerted=g.alerted.filter(i=>i*SMS(g)<=c);
  if(g.pending!=null&&g.pending*SMS(g)>c)g.pending=null;
  save();renderAll();
}
function undo(){
  const g=G();if(!g.events.length)return;const last=g.events[g.events.length-1].b;
  g.events=g.events.filter(e=>e.b!==last);say('Last change undone');save();renderAll();
}
function addGoal(o){const g=G();if(!g.started){g.started=true;g.runStart=T();}g.goals.push(o);g.goals.sort((a,b)=>a.t-b.t);}

function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);}
function readLogo(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const s=160,sc=Math.min(1,s/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    CFG().logo=cv.toDataURL('image/jpeg',0.85);say('Logo updated');save();renderAll();};img.src=r.result;};
  r.readAsDataURL(f);

const VIEW_OK=new Set(['sheetclose','game','tab','unlock','song','cancel','pickcancel','teamgo']);
function act(a,ds){
  if(!CFG()&&a!=='teamgo')return;
  const g=CFG()?G():null;
  if(!canEdit()&&!VIEW_OK.has(a)){say('You’re following along. Coaches can unlock on the Team tab.');renderHint();return;}
  switch(a){
    case 'editor':S.auth={};delete S.master;saveLocal();resetSync();SY.first=false;say('This device is now view only');break;
    case 'unlock':unlock();return;
    case 'song':S.song=!songOn();saveLocal();if(S.song){primeSong();say('Goal song on for this device');}else{try{songAudio().pause();}catch(e){}say('Goal song off for this device');}break;
    case 'fmode':UI.fieldMode=ds.m;UI.sel=null;break;
    case 'sheetclose':UI.sheet=null;break;
    case 'sheetmore':if(UI.sheet)UI.sheet.more=!UI.sheet.more;break;
    case 'stat':if(UI.sheet){addStat(UI.sheet.pos,UI.sheet.id,ds.k);UI.sheet=null;}break;
    case 'statgoal':if(UI.sheet){UI.goal={side:'us',t:Math.round(clock(g)),step:'ast',by:UI.sheet.id};UI.sheet=null;playSong();}break;
    case 'statundo':undoStat();break;
    case 'statdel':{const k=+ds.i;if(armed('stat'+k)){const s=g.stats.splice(k,1)[0];if(s&&s.k==='save'){const i=g.saves.findIndex(x=>x.t===s.t&&x.gk===s.id);if(i>=0)g.saves.splice(i,1);}UI.arm=null;save();}else arm('stat'+k);break;}
    case 'goalminus':{const side=ds.side;const k=g.goals.map((x,i)=>x.side===side?i:-1).filter(i=>i>=0).pop();
      if(k===undefined){say('No goal to take off');break;}
      if(armed('minus'+side)){g.goals.splice(k,1);UI.arm=null;UI.lastUs=scoreOf(g).us;say('Goal taken off');save();}else{arm('minus'+side);say('Tap − again to take off the last '+(side==='us'?shortName():oppName())+' goal');}break;}
    case 'goalus':UI.goal={side:'us',t:Math.round(clock(g)),step:'by'};playSong();break;
    case 'goalthem':{const d=replay(g);addGoal({side:'them',t:Math.round(clock(g)),gk:d.L.GK||null});say(oppName()+' goal at '+fmt(clock(g)));save();break;}
    case 'endgame':
      if(armed('endgame')){if(g.running){g.acc=clock(g);g.running=false;}g.started=true;g.fullDone=true;g.halfDone=true;g.pending=null;
        const E=ends(g);if(!g.stops.includes(E[E.length-1]))g.stops.push(E[E.length-1]);UI.arm=null;UI.sel=null;
        const sc=scoreOf(g);say('Final: '+shortName()+' '+sc.us+', '+oppName()+' '+sc.them);save();}
      else{arm('endgame');say('Tap End game again to make the score final');}
      break;
    case 'reopen':if(armed('reopen')){g.fullDone=false;UI.arm=null;say('Game reopened');save();}else arm('reopen');break;
    case 'goalcancel':UI.goal=null;break;
    case 'goalby':if(!UI.goal)break;
      if(ds.id){UI.goal.by=ds.id;UI.goal.step='ast';}
      else{addGoal({side:'us',t:UI.goal.t});UI.lastUs=scoreOf(g).us;say('Goal '+shortName()+'!');UI.goal=null;save();}
      break;
    case 'goalast':if(!UI.goal)break;
      addGoal({side:'us',t:UI.goal.t,by:UI.goal.by,ast:ds.id||null});UI.lastUs=scoreOf(g).us;say('Goal! '+nm(UI.goal.by)+' at '+fmt(UI.goal.t));UI.goal=null;save();break;
    case 'goaldel':{const k=+ds.i;if(armed('goal'+k)){g.goals.splice(k,1);UI.arm=null;say('Goal removed');save();}else arm('goal'+k);break;}
    case 'save':{const d=replay(g);g.saves.push({t:Math.round(clock(g)),gk:d.L.GK||null});say('Save, '+nm(d.L.GK));save();break;}
    case 'savedel':{const k=+ds.i;if(armed('save'+k)){g.saves.splice(k,1);UI.arm=null;say('Save removed');save();}else arm('save'+k);break;}
    case 'ot':if(g.fullDone&&!g.ot&&!g.pk){g.ot={n:g.otN||2,len:g.otLen||5};g.fullDone=false;say('Overtime added. Tap Start overtime when ready.');save();}break;
    case 'otcancel':if(g.ot&&!g.running&&clock(g)===2*HMS(g)){g.ot=null;g.fullDone=true;save();}break;
    case 'pk':if(g.fullDone&&!g.pk){g.pk={us:[],them:[],order:[]};save();}break;
    case 'pkus':UI.pk={step:'kicker'};break;
    case 'pkkicker':UI.pk={step:'result',id:ds.id};break;
    case 'pkres':if(UI.pk&&UI.pk.id){g.pk.us.push({id:UI.pk.id,made:ds.m==='1'});g.pk.order.push('us');if(ds.m==='1')playSong();UI.pk=null;save();}break;
    case 'pkthem':g.pk.them.push(ds.m==='1');g.pk.order.push('them');save();break;
    case 'pkundo':{const o=g.pk.order.pop();if(o==='us')g.pk.us.pop();else if(o==='them')g.pk.them.pop();else if(!g.pk.us.length&&!g.pk.them.length)g.pk=null;UI.pk=null;save();break;}
    case 'pkcancel':UI.pk=null;break;
    case 'game':S.cur[S.team]=+ds.i;UI.goal=null;UI.pk=null;UI.sel=null;UI.adj=false;UI.pick=null;UI.win=undefined;UI.lastUs=undefined;useTeam();saveLocal();break;
    case 'tab':S.tab=ds.t;if(ds.t==='setup')loadTeamList();saveLocal();break;

    case 'cell':{const k=+ds.k,p=ds.p;UI.pick=(UI.pick&&UI.pick.k===k&&UI.pick.p===p)?null:{k,p,all:false};break;}

      if(armed('planreset')){const gc=GC();g.plan=validPlan(gc.plan,g.form)?gc.plan.map(b=>Object.assign({},b)):autoPlan(g);UI.arm=null;UI.pick=null;say('Saved plan restored');save();}

function keeperStats(list){

  h+=gl.length?'<ul class="log">'+gl.map(x=>`<li class="${x.side==='us'?'goal':''}"><div class="lt">${gmin(x.t)}</div><div class="ll"><div>${x.side==='us'?'Goal '+esc(shortName())+(x.by?': '+esc(nm(x.by)):'')+(x.ast?', assist '+esc(nm(x.ast)):''):'Goal '+esc(oppName())}</div></div></li>`).join('')+'</ul>'
    :'<div class="empty">No goals yet.</div>';
  h+=keeperHTML(keeperStats([{g,rep:g.started?d:null}]),'Keepers');
  return h;
}
function renderPanel(){
  renderTabs();const d=replay(G());const b=$('tbody');
  if(isParent())b.innerHTML=S.tab==='players'?renderTeam(d):S.tab==='log'?renderGoals(d):renderParentBench(d);
  else b.innerHTML=S.tab==='plan'?renderPlan(d):S.tab==='players'?renderPlayers(d):S.tab==='log'?renderLog(d):S.tab==='stats'?renderStats(d):S.tab==='minutes'?renderMinutes():S.tab==='setup'?renderSetup():renderBench(d);
  if(UI.focus){const el=$(UI.focus);UI.focus=null;if(el){el.focus();try{el.select();}catch(e){}}}
}
function renderSync(){
  const el=$('sync');if(!el)return;
  if(!SY.on){el.hidden=true;return;}
  el.hidden=false;el.className='sync '+(SY.ok?(canEdit()?'run':'view'):'lost');
  el.textContent=SY.ok?(canEdit()?'Live: running games':'Live'):'Sync lost, retrying';
}
function renderLive(){
  if(!CFG())return;const g=G();const d=replay(g);
  document.querySelectorAll('[data-lv="played"]').forEach(el=>{const s=d.st[el.dataset.id];if(s)el.textContent=fmt(s.played);});
  document.querySelectorAll('[data-lv="sattot"]').forEach(el=>{const s=d.st[el.dataset.id];if(s)el.textContent=fmt(d.now-s.played);});
  document.querySelectorAll('[data-lv="sit"]').forEach(el=>{const s=d.st[el.dataset.id];if(s)el.textContent=fmt(d.now-s.offAt);});
  document.querySelectorAll('[data-lv="kick"]').forEach(el=>{el.textContent=countdown(GC());});
}
function renderFmode(){
  const el=$('fmode');if(!el)return;
  if(!canEdit()){el.innerHTML='';UI.fieldMode='sub';return;}
  const m=UI.fieldMode||'sub';
  el.innerHTML=`<div class="fmode"><span>Tap a player to:</span><button data-act="fmode" data-m="sub" aria-pressed="${m==='sub'}">Sub</button><button data-act="fmode" data-m="stat" aria-pressed="${m==='stat'}">Track stats</button>${m==='stat'&&(G().stats||[]).length?`<button class="undo" data-act="statundo">Undo last</button>`:''}</div>`;
}
function renderSheet(){
  const el=$('sheet');if(!el)return;const s=UI.sheet;
  if(!s||!CFG()){el.innerHTML='';return;}
  const grp=(PI[s.pos]&&PI[s.pos].g)||'MID';const o=statOrder(grp);
  const c=statCounts(G())[s.id]||{};const cnt=k=>c[k]?`<i>${c[k]}</i>`:'';
  el.innerHTML=`<div class="sheetbg" data-act="sheetclose"></div><div class="sheetp" role="dialog" aria-label="Stats for ${esc(nm(s.id))}">
    <div class="sh"><div><b>${esc(nm(s.id))}</b>${jn(P[s.id])}<div class="fine">${esc(PI[s.pos]?PI[s.pos].name:s.pos)} at ${fmt(clock(G()))}</div></div><button class="btn small" data-act="sheetclose">Close</button></div>
    <div class="sgrid">${o.top.map(k=>`<button class="sbtn" data-act="stat" data-k="${k}">${STATS[k]}${cnt(k)}</button>`).join('')}${grp!=='GK'?`<button class="sbtn goal" data-act="statgoal">⚽ Goal</button>`:''}</div>
    <button class="btn small more" data-act="sheetmore">${s.more?'Fewer':'More stats'}</button>
    ${s.more?`<div class="sgrid sm">${o.rest.map(k=>`<button class="sbtn" data-act="stat" data-k="${k}">${STATS[k]}${cnt(k)}</button>`).join('')}</div>`:''}</div>`;
}
function renderAll(){
  renderSync();
  if(!CFG()){$('bname').textContent='Loading…';$('bsub').textContent='';$('tbody').innerHTML='<div class="empty">Loading the team…</div>';return;}
  useTeam();renderBrand();renderGames();renderCtrl();renderClock();renderScore();renderBanner();renderFmode();renderField();renderHint();renderSheet();
  const ae=document.activeElement;const typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&$('tbody').contains(ae)&&ae.type!=='file';
  if(!typing)renderPanel();else renderTabs();
}

/* ---------- Clock loop ---------- */
let lastSec=-1;
function tick(){
  if(!CFG())return;
  const g=G();let changed=false;
  if(g.running){
    const E=ends(g);let c=clock(g);
    for(const e of E){if(c>=e&&!g.stops.includes(e)){g.acc=e;g.running=false;g.stops.push(e);if(e===E[0])g.halfDone=true;if(e===E[E.length-1]){g.fullDone=true;g.pending=null;}changed=true;alarm();break;}}
    c=clock(g);const H=HMS(g),SUB=SMS(g);
    if(!g.fullDone)for(let i=1;i*SUB<2*H;i++){if(i*SUB<=c&&!g.alerted.includes(i)){g.alerted.push(i);if(i<PL().length)g.pending=i;changed=true;alarm();}}
  }
  if(UI.msg&&Date.now()>UI.msgT){UI.msg='';renderHint();}
  if(changed){save();renderAll();return;}
  const wk=winK(g,clock(g));
  if(wk!==UI.win){const was=UI.win;UI.win=wk;if(wk!=null&&g.pending==null&&g.running&&was!==undefined)alarm();renderAll();return;}
  renderClock();
  const sec=Math.floor(clock(g)/1000);
  if(sec!==lastSec){lastSec=sec;renderLive();}
}

/* ---------- Club page ---------- */
const CLUB={data:null,on:false,ok:false,edit:false};
const clubLink=()=>location.pathname+'?club=1';
const teamLink=id=>location.pathname+'?team='+encodeURIComponent(id);
function summarizeGame(g,pname){
  const goals=g.goals||[];
  return {started:!!g.started,running:!!g.running,acc:g.acc||0,runStart:g.runStart||0,half:g.half||30,ot:g.ot||null,fullDone:!!g.fullDone,stops:g.stops||[],
    us:goals.filter(x=>x.side==='us').length,them:goals.filter(x=>x.side==='them').length,
    pk:g.pk?{us:(g.pk.us||[]).filter(k=>k.made).length,them:(g.pk.them||[]).filter(Boolean).length}:null,
    scorers:goals.filter(x=>x.side==='us').map(x=>({t:x.t,by:x.by?(pname[x.by]||''):''}))};
}
function localClub(){
  const teams=Object.keys(S.T).filter(id=>S.T[id].cfg).map(id=>{const c=S.T[id].cfg;const pname={};c.players.forEach(p=>pname[p.id]=p.name);
    return {id,name:c.name,short:c.short||'',sub:c.sub||'',logo:c.logo||null,format:c.format,
      games:c.games.map(gc=>{const st=S.T[id].games[gc.id];return {id:gc.id,title:gc.title,oppLogo:gc.oppLogo||'',opp:gc.opp||'',dt:gc.dt||'',when:gc.when||'',field:gc.field||'',place:gc.place||'',half:gc.half||30,s:st?summarizeGame(st,pname):null};})};});
  return {club:S.club||null,teams};
}
async function clubFetch(){
  try{const t0=Date.now();const r=await fetch(API+'?club=1',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!j||!Array.isArray(j.teams))throw 0;
    const off=j.now-Math.round((t0+Date.now())/2);OFF=CLUB.on?Math.round(OFF*0.8+off*0.2):off;
    CLUB.on=true;CLUB.ok=true;CLUB.data=j;}
  catch(e){if(!CLUB.on)CLUB.data=localClub();else CLUB.ok=false;}
  renderClub();
}
const clubName=()=>(CLUB.data&&CLUB.data.club&&CLUB.data.club.name)||(S.club&&S.club.name)||'Cottontown United';
const clubLogo=()=>(CLUB.data&&CLUB.data.club&&CLUB.data.club.logo)||(S.club&&S.club.logo)||LOGO;
function sClock(s){const tot=2*s.half*60000+(s.ot?s.ot.n*s.ot.len*60000:0);return Math.min(tot,s.acc+(s.running?T()-s.runStart:0));}
function sPeriod(s){
  if(s.fullDone)return s.pk?'Final after PKs':'Final';
  const c=sClock(s),H=s.half*60000;
  if(!s.running&&s.stops.includes(c)){if(c===H)return 'Halftime';if(c===2*H)return s.ot?'End of regulation':'Full time';return 'Overtime break';}
  if(c<H)return '1st half';if(c<2*H||!s.ot)return '2nd half';return 'Overtime';
}
function sResult(s){if(!s||!s.fullDone)return null;if(s.us>s.them)return 'W';if(s.us<s.them)return 'L';
  if(s.pk){if(s.pk.us>s.pk.them)return 'W';if(s.pk.us<s.pk.them)return 'L';}return 'D';}
const scoreStr=s=>s.us+'–'+s.them+(s.pk?` (PKs ${s.pk.us}–${s.pk.them})`:'');
function teamBadge(t,cls){const ini=(t.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();return t.logo?`<img class="${cls}" src="${t.logo}" alt="">`:`<span class="${cls} badge">${esc(ini)}</span>`;}
function renderClub(){
  const el=$('club');const d=CLUB.data;if(!d){el.innerHTML='<div class="empty">Loading the club…</div>';return;}
  const all=[];d.teams.forEach(t=>t.games.forEach(g=>{if(g.s&&g.s.scorers)g.s.scorers=g.s.scorers.filter(x=>x.by||x.t>0);all.push({t,g});}));
  const live=all.filter(x=>x.g.s&&x.g.s.started&&!x.g.s.fullDone);
  const tsOf=x=>{const v=x.g.dt?new Date(x.g.dt).getTime():NaN;return isNaN(v)?Infinity:v;};
  const upcoming=all.filter(x=>!x.g.s||!x.g.s.started).sort((a,b)=>tsOf(a)-tsOf(b)).slice(0,10);
  const now=new Date();const season=new Date(now.getMonth()>=7?now.getFullYear():now.getFullYear()-1,7,1).getTime();
  const inSeason=x=>tsOf(x)!==Infinity&&tsOf(x)>=season;
  const results=all.filter(x=>x.g.s&&x.g.s.fullDone&&inSeason(x)).sort((a,b)=>tsOf(b)-tsOf(a)).slice(0,15);
  const canClubEdit=!CLUB.on||!!S.master;
  let h=`<header class="clubtop"><img src="${clubLogo()}" alt=""><div><h1>${esc(clubName())}</h1><p>Club scoreboard${CLUB.on?(CLUB.ok?' <span class="sync run">Live</span>':' <span class="sync lost">Reconnecting</span>'):''}</p></div></header><main class="clubmain">`;
  // weekend window: Friday 00:00 through Sunday 23:59 of this week (or the coming one, Mon-Thu)
  const wd=now.getDay();const sun=new Date(now.getFullYear(),now.getMonth(),now.getDate()+((7-wd)%7));
  const wkStart=Math.min(new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()-2).getTime(),new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()),wkEnd=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate(),23,59,59).getTime();
  const inWk=g=>{const v=tsOf({g});return v!==Infinity&&v>=wkStart&&v<=wkEnd;};
  const recOf=t=>{let w=0,l=0,dr=0;t.games.forEach(g=>{if(!inSeason({g}))return;const r=sResult(g.s);if(r==='W')w++;else if(r==='L')l++;else if(r==='D')dr++;});return `${w}-${dr}-${l}`;};
  const gameLine=(t,g)=>{const s=g.s;let st;
    if(s&&s.started&&!s.fullDone)st=`<span class="gl-live"><b>${s.us}–${s.them}</b> <span data-ck="${t.id}/${g.id}">${fmtClock(sClock(s))}</span> <span class="per" data-cp="${t.id}/${g.id}">${sPeriod(s)}</span></span>`;
    else if(s&&s.fullDone){const r=sResult(s);st=`<span class="res r${r}">${r}</span> <b class="glsc">${scoreStr(s)}</b>`;}
    else{const cd=countdown(g);st=cd?`<span class="cd" data-kick="${esc(g.dt)}">${cd}</span>`:'';}
    return `<div class="gl ${s&&s.started&&!s.fullDone?'on':''}">${logoImg(oppLogoOf(g),'cls')}<div class="cinfo"><b>vs ${esc(g.opp||g.title||'Opponent')}</b><div class="fine">${esc(whenText(g))}${g.field?', '+esc(g.field):''}</div></div><div class="glst">${st}</div></div>`;};
  const wkTeams=d.teams.filter(t=>t.games.some(inWk)).map(t=>({t,first:Math.min(...t.games.filter(inWk).map(g=>tsOf({g}))),live:t.games.some(g=>g.s&&g.s.started&&!g.s.fullDone)}))
    .sort((a,b)=>(b.live-a.live)||(a.first-b.first));
  const others=d.teams.filter(t=>!t.games.some(inWk)).sort((a,b)=>a.name.localeCompare(b.name));
  const wkLabel=new Date(wkStart<new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()-2).getTime()?wkStart:wkStart+864e5).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'–'+new Date(wkEnd).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  h+=`<section class="cs"><h2>Playing this weekend <span class="wk">${wkLabel}</span></h2>`+(wkTeams.length?'<div class="cgrid wkgrid">'+wkTeams.map(({t,live})=>{
      const gs=t.games.filter(inWk).sort((a,b)=>tsOf({g:a})-tsOf({g:b}));
      return `<a class="ccard ${live?'live':''}" href="${teamLink(t.id)}"><div class="ct">${teamBadge(t,'cl')}<div><b>${esc(t.name)}</b><div class="fine">${esc([t.sub,t.format].filter(Boolean).join(', '))}${t.games.some(g=>inSeason({g})&&g.s&&g.s.fullDone)?', '+recOf(t)+' this season':''}</div></div>${live?'<span class="livepill">Live</span>':''}</div>
        <div class="gls">${gs.map(g=>gameLine(t,g)).join('')}</div><div class="open">Open team ›</div></a>`;}).join('')+'</div>':'<p class="muted">No games scheduled this weekend.</p>')+'</section>';
  if(others.length)h+=`<section class="cs"><h2>Other teams</h2><div class="cgrid">`+others.map(t=>{
      const nx=t.games.filter(g=>!g.s||!g.s.started).sort((a,b)=>tsOf({g:a})-tsOf({g:b}))[0];
      return `<a class="ccard" href="${teamLink(t.id)}"><div class="ct">${teamBadge(t,'cl')}<div><b>${esc(t.name)}</b><div class="fine">${esc([t.sub,t.format].filter(Boolean).join(', '))}</div></div></div>
        <div class="fine">${recOf(t)} this season${nx?`. Next: ${nx.opp?'vs '+esc(nx.opp)+', ':''}${esc(whenText(nx))}`:''}</div></a>`;}).join('')+'</div></section>';
  h+=`<section class="cs"><h2>Recent results</h2>`+(results.length?'<div class="clist">'+results.map(({t,g})=>{const s=g.s;const r=sResult(s);
    return `<a class="crow" href="${teamLink(t.id)}">${teamBadge(t,'cls')}<div class="cinfo"><b>${esc(t.name)}</b> vs ${esc(g.opp||'Opponent')}${logoImg(oppLogoOf(g),'ilg')}<div class="fine">${esc(whenText(g))}${s.scorers.length?': '+s.scorers.map(x=>esc(x.by||'Goal')).join(', '):''}</div></div><span class="res r${r}">${r}</span><span class="cfinal">${scoreStr(s)}</span></a>`;}).join('')+'</div>':'<p class="muted">No finished games yet this season.</p>')+'</section>';
  if(CLUB.on&&S.master){h+=`<section class="cs"><h2>Coach tools</h2><button class="btn small primary-s" data-cact="puball" ${UI.pubBusy?'disabled':''}>${UI.pubBusy?'Loading teams…':'Load all teams'}</button>${CLUB.msg?`<p class="fine">${esc(CLUB.msg)}</p>`:'<p class="fine">Adds every team saved on this iPad to the club page. Teams already here aren’t changed.</p>'}</section>`;}
  if(canClubEdit){
    h+=`<section class="cs"><h2>Club settings</h2>${CLUB.edit?`<div class="card"><label class="fld">Club name<input id="club-name" value="${esc(clubName())}"></label>
      <div class="fld">Club logo<div class="logorow"><img src="${clubLogo()}" alt=""><label class="btn small filebtn">Upload<input type="file" accept="image/*" id="club-logo" hidden></label></div></div>
      <div class="gacts"><button class="btn small primary-s" data-cact="save">Save</button><button class="btn small" data-cact="cancel">Cancel</button></div></div>`
      :`<button class="btn small" data-cact="edit">Edit club name and logo</button>`}</section>`;
  }
  h+=`<p class="fine cfoot">Tap a team or game to follow it live. ${CLUB.on?'Scores update every few seconds.':''}</p></main>`;
  el.innerHTML=h;
}
function clubTick(){
  if(!CLUB.data)return;
  document.querySelectorAll('[data-ck]').forEach(el=>{const [tid,gid]=el.dataset.ck.split('/');const t=CLUB.data.teams.find(x=>x.id===tid);const g=t&&t.games.find(x=>x.id===gid);if(g&&g.s){el.textContent=fmtClock(sClock(g.s));const p=document.querySelector(`[data-cp="${tid}/${gid}"]`);if(p)p.textContent=sPeriod(g.s);}});
  document.querySelectorAll('[data-kick]').forEach(el=>{el.textContent=countdown({dt:el.dataset.kick});});
}
let clubLogoData=null;
document.addEventListener('change',e=>{if(e.target&&e.target.id==='club-logo'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const s=200,sc=Math.min(1,s/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);clubLogoData=cv.toDataURL('image/jpeg',0.85);
    const pv=document.querySelector('#club .logorow img');if(pv)pv.src=clubLogoData;};img.src=r.result;};r.readAsDataURL(f);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cact]');if(!b)return;const a=b.dataset.cact;
  if(a==='puball'){publishAll();return;}
  if(a==='edit'){CLUB.edit=true;clubLogoData=null;renderClub();return;}
  if(a==='cancel'){CLUB.edit=false;renderClub();return;}
  if(a==='save'){const nmv=($('club-name')||{}).value||clubName();const club={name:nmv.trim()||clubName(),logo:clubLogoData||clubLogo()};
    S.club=club;saveLocal();
    if(CLUB.on){try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'club',team:'cottontown',club,code:S.master||''})});}catch(err){}}
    if(CLUB.data)CLUB.data.club=club;CLUB.edit=false;renderClub();clubFetch();}
});
function clubInit(){
  document.querySelector('.app').style.display='none';$('club').hidden=false;document.title='Club scoreboard';
  renderClub();clubFetch();setInterval(()=>{if(document.visibilityState==='visible'&&!CLUB.edit)clubFetch();},5000);setInterval(clubTick,1000);
}

function init(){
  S=load();
  const QP=new URLSearchParams(location.search);
  if(QP.has('club')||!QP.has('team')){clubInit();return;}
  const qp=new URLSearchParams(location.search).get('team');
  if(qp&&/^[a-z0-9-]{1,40}$/.test(qp)){S.team=qp;if(!S.T[qp])S.T[qp]={cfg:null,games:{}};}
  if(!S.T[S.team])S.team='cottontown';
  SY.team=S.team;
  if(CFG())useTeam();
  renderAll();setInterval(tick,250);syncInit();
}
init();
})();
